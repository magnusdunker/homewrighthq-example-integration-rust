[workspace]
members = ["sdk"]

[package]
name = "thehome-example-counter"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Eksempel på en ekstern integration til TheHome: en tæller"
publish = false

[[bin]]
name = "example_counter"
path = "src/main.rs"

[dependencies]
thehome-plugin = { path = "sdk" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
serde_json = "1"
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
